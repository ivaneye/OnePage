name: Release Obsidian theme

# push tag（如 1.1.3）时自动创建 GitHub Release，并把安装文件作为 assets 附上。
# 这是 Obsidian 社区目录的硬性要求：只提交到仓库不算数，必须挂在 Release 上。
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")

          if [ "$tag" != "$version" ]; then
            echo "::error::tag ($tag) 与 manifest.json version ($version) 不一致"
            exit 1
          fi

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            manifest.json theme.css
