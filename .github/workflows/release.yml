name: Release Obsidian theme

# push tag（如 2.0.0）时自动创建 GitHub Release，并把安装文件作为 assets 附上。
# 这是 Obsidian 社区目录的硬性要求：只提交到仓库不算数，必须挂在 Release 上。
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify theme.css matches src/ (catch a forgotten build)
        run: node scripts/verify.mjs

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")

          if [ "$tag" != "$version" ]; then
            echo "::error::tag ($tag) 与 manifest.json version ($version) 不一致"
            exit 1
          fi

          # Release 说明直接取 RELEASE.md 里该版本的条目，避免与仓库文档两处维护
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const text = fs.readFileSync("RELEASE.md", "utf8");
            const start = text.indexOf("### " + v);
            if (start < 0) {
              console.error("::error::RELEASE.md 里找不到版本 " + v + " 的条目");
              process.exit(1);
            }
            const next = text.indexOf("\n### ", start + 4);
            const body = text.slice(start, next < 0 ? text.length : next).trim();
            fs.writeFileSync("release-notes.md", body + "\n");
          ' "$version"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            manifest.json theme.css
